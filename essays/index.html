<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>散文 · 蜉蝣阁</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>.section-page .card { flex-direction: column; }
.section-page .card-img { width: calc(100% + 56px); max-height: 300px; border-radius: var(--radius) var(--radius) 0 0; margin: -24px -28px 16px; object-fit: cover; }
.card-snippet { white-space: pre-line; }</style>
</head>
<body class="section-page">
    <nav class="nav">
        <a href="/">博客</a>
        <a href="/poetry/">古诗</a>
        <a href="/essays/" class="active">散文</a>
        <a href="/social/">链接</a>
    </nav>

    <header class="header">
        <h1>📝 原创散文</h1>
        <p class="subtitle">新增散文在 散文.json 中追加即可</p>
    </header>

    <main class="container">
        <div id="essay-list"></div>
    </main>

    <footer class="footer">
        <p>蜉蝣子 ♡ 蜉蝣阁</p>
    </footer>

    <script src="/js/blog-loader.js"></script>
    <script>loadSection('essay', 'essay-list');</script>
<script>
(function(){
document.addEventListener('copy',function(e){e.preventDefault();var t='————————————\n作者：蜉蝣\n原文链接：'+window.location.href+'\n来源：fsg.foryoufsg.com\n————————————';e.clipboardData?e.clipboardData.setData('text/plain',t):window.clipboardData&&window.clipboardData.setData('Text',t)});
var goHome=function(){window.location.href='/'};
document.addEventListener('keydown',function(e){if(e.key==='F12'||(e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='I'||e.key==='J')||(e.ctrlKey||e.metaKey)&&(e.key==='u'||e.key==='s')){e.preventDefault();goHome()}});
var dto=!1;
setInterval(function(){var t=window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160;t&&!dto&&(dto=!0,goHome());dto=t},1e3);
})();
</script>
</body>
</html>
