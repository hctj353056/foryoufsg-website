<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜉蝣阁 · 博客</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav">
        <a href="/" class="active">博客</a>
        <a href="/poetry/">古诗</a>
        <a href="/essays/">散文</a>
        <a href="/social/">链接</a>
    </nav>

    <header class="header">
        <h1>蜉蝣阁</h1>
        <p class="subtitle">朝生暮死 · 以思为翼 · 以数为庭</p>
    </header>

    <main class="container">
        <div id="blog-feed"></div>
    </main>

    <footer class="footer">
        <p>蜉蝣子 ♡ 蜉蝣阁</p>
    </footer>

    <script src="/js/blog-loader.js"></script>
    <script>loadBlog('blog-feed');</script>
<script>
// ==========================================
// 版权保护：复制劫持 + 开发者工具检测
// ==========================================
(function(){
document.addEventListener('copy',function(e){e.preventDefault();var t='————————————\n作者：蜉蝣\n原文链接：'+window.location.href+'\n来源：fsg.foryoufsg.com\n————————————';e.clipboardData?e.clipboardData.setData('text/plain',t):window.clipboardData&&window.clipboardData.setData('Text',t)});
var goHome=function(){window.location.href='/'};
document.addEventListener('keydown',function(e){if(e.key==='F12'||(e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='I'||e.key==='J')||(e.ctrlKey||e.metaKey)&&(e.key==='u'||e.key==='s')){e.preventDefault();goHome()}});
var dto=!1;
setInterval(function(){var t=window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160;t&&!dto&&(dto=!0,goHome());dto=t},1e3);
})();
</script>
</body>
